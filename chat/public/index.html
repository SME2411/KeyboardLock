<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Чат</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="auth" hidden>
  <form id="authForm">
    <h1>💬 Чат</h1>
    <input id="username" placeholder="Имя" autocomplete="username" required>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <input id="invite" placeholder="Код приглашения" hidden>
    <button type="submit" id="authBtn">Войти</button>
    <a href="#" id="toggle">Первый раз? Зарегистрироваться</a>
    <p id="authErr" class="err"></p>
  </form>
</section>

<section id="app" hidden>
  <header>
    <button id="back" hidden>←</button>
    <div><strong id="title">Чат</strong><small id="status"></small></div>
    <button id="logout" title="Выйти">⎋</button>
  </header>
  <div id="contacts"></div>
  <div id="chat" hidden>
    <div id="messages"></div>
    <form id="composer">
      <textarea id="text" rows="1" placeholder="Сообщение…" maxlength="4000"></textarea>
      <button type="submit">➤</button>
    </form>
  </div>
</section>
<script src="/app.js" type="module"></script>
</body>
</html>
