<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="themeColor">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DuoVerse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DuoVerse</title>
<script>
// Применяем сохранённые настройки до первой отрисовки, чтобы не было «мигания» темой.
(function () {
  var s = {}; try { s = JSON.parse(localStorage.getItem('duoverse.settings') || '{}'); } catch (e) {}
  var d = document.documentElement;
  var dark = s.mode === 'dark' || ((s.mode || 'system') === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  d.dataset.mode = dark ? 'dark' : 'light'; d.dataset.style = s.style || 'graphite';
  d.dataset.anim = s.anim || 'full'; d.dataset.emojiAnim = s.emojiAnim === false ? 'off' : 'on'; d.dataset.fs = s.fontSize || 'm';
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section id="auth" hidden>
  <form id="authForm">
    <div class="mono">D</div>
    <h1>DuoVerse</h1>
    <p class="sub">Только для двоих</p>
    <input id="username" placeholder="Имя" autocomplete="username" autocapitalize="none" required>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <input id="invite" placeholder="Код приглашения" autocomplete="off" hidden>
    <button type="submit" id="authBtn">Войти</button>
    <a href="#" id="toggle">Первый раз? Зарегистрироваться</a>
    <p id="authErr" class="err"></p>
  </form>
</section>

<section id="app" hidden>
  <header>
    <button id="back" class="icon-btn" aria-label="Назад" hidden>←</button>
    <div id="avatar" class="avatar" hidden></div>
    <div class="who"><strong id="title">DuoVerse</strong><small id="status"></small></div>
    <button id="settingsBtn" class="icon-btn" aria-label="Настройки">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </header>
  <div id="banner" hidden><span id="bannerText"></span><button id="bannerBtn" hidden>Включить</button></div>
  <div id="contacts"></div>
  <div id="chat" hidden>
    <div id="messages"></div>
    <div id="emoji" hidden>
      <div id="emojiTabs"></div>
      <div id="emojiGrid"></div>
    </div>
    <form id="composer">
      <button type="button" id="attachBtn" class="icon-btn" aria-label="Прикрепить файл">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5 12.6 20a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
      </button>
      <input type="file" id="fileInput" multiple hidden>
      <button type="button" id="emojiBtn" class="icon-btn" aria-label="Эмодзи">😊</button>
      <textarea id="text" rows="1" placeholder="Сообщение…" maxlength="4000"></textarea>
      <button type="submit" id="sendBtn" aria-label="Отправить"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6l-.01 6.5L15 12 3.39 13.9z"/></svg></button>
    </form>
  </div>
</section>

<div id="lightbox" hidden><img alt=""><a id="lbDl" download>Скачать</a></div>

<div id="settings" hidden>
  <div id="sheetBg"></div>
  <aside id="sheet" role="dialog" aria-label="Настройки"></aside>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
